name: Secret Scanning
on:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pulp-ui (${{ github.ref }})
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
