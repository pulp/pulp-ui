name: Test
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pulp-ui (${{ github.ref }})
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: npm Setup
        uses: $/.github/actions/npm-setup

      - name: Run tests
        run: npm run test
